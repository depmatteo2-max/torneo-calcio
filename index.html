<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🦁 MC Lion Trophy 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      /* MC Lion colori */
      --primario:   #D42B2B;
      --primario-dk:#A81E1E;
      --giallo:     #F5A800;
      --blu:        #1A4FA0;
      --blu-bg:     #eff6ff;
      --blu-lt:     #2563c4;
      --verde:      #16a34a;
      --verde-bg:   #f0fdf4;
      --rosso:      #dc2626;
      --rosso-bg:   #fef2f2;
      --arancio:    #D42B2B;
      --arancio-bg: rgba(212,43,43,0.06);
      /* Layout */
      --sfondo:     #f8fafc;
      --sfondo2:    #f1f5f9;
      --testo:      #1e293b;
      --testo-lt:   #475569;
      --testo-2:    #64748b;
      --testo-xs:   #94a3b8;
      --bordo:      #e2e8f0;
      --bordo-lt:   #f1f5f9;
      --shadow-xs:  0 1px 2px rgba(0,0,0,.05);
      --shadow:     0 1px 4px rgba(0,0,0,.08);
      --shadow-md:  0 4px 12px rgba(0,0,0,.1);
      --radius:     12px;
      --radius-sm:  8px;
      --font-display:'Segoe UI',Roboto,system-ui,sans-serif;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { -webkit-tap-highlight-color:transparent; }
    body { font-family:var(--font-display); background:var(--sfondo); color:var(--testo); min-height:100vh; overscroll-behavior:none; }

    /* ── LOADING ── */
    #loading-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:14px; background:#fff; }
    #loading-screen .load-logo { font-size:64px; animation:bounce 1.2s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    #loading-screen .load-title { font-size:20px; font-weight:800; color:var(--primario); letter-spacing:1px; }
    #loading-screen .load-sub { font-size:12px; color:var(--testo-xs); }
    #loading-screen .load-bar { width:120px; height:3px; background:var(--bordo); border-radius:2px; overflow:hidden; }
    #loading-screen .load-bar-fill { height:100%; background:linear-gradient(90deg,var(--primario),var(--giallo)); animation:loadbar 1.4s ease-in-out infinite; }
    @keyframes loadbar { 0%{width:0;margin-left:0} 50%{width:70%;margin-left:15%} 100%{width:0;margin-left:100%} }
    #loading-img { width:64px; height:64px; object-fit:contain; display:none; border-radius:50%; border:3px solid var(--giallo); }

    /* ── MAIN APP ── */
    #main-app { display:none; flex-direction:column; min-height:100vh; }

    /* ── HEADER ── */
    .app-header {
      background: linear-gradient(135deg, var(--primario-dk) 0%, var(--primario) 60%, #8B0000 100%);
      border-bottom: 3px solid var(--giallo);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top:0; z-index:200;
      min-height: 56px;
      box-shadow: 0 2px 12px rgba(212,43,43,0.3);
    }
    .header-left { display:flex; align-items:center; gap:10px; }
    #header-logo { width:40px; height:40px; object-fit:contain; border-radius:8px; display:none; border:2px solid rgba(255,255,255,0.3); }
    #header-title { font-size:17px; font-weight:800; color:white; letter-spacing:0.5px; text-shadow:0 1px 4px rgba(0,0,0,0.3); }
    #header-date { font-size:10px; color:rgba(255,255,255,0.65); margin-top:1px; letter-spacing:0.5px; }
    .header-right { display:flex; align-items:center; gap:8px; }
    #admin-btn {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.9);
      padding: 6px 14px; border-radius: 20px;
      cursor: pointer; font-size: 12px;
      font-family: inherit; font-weight: 700;
      transition: all .2s;
    }
    #admin-btn:hover { background:rgba(0,0,0,0.4); }

    /* ── NAV ORIZZONTALE (stile Coaching) ── */
    #pub-nav {
      background: #fff;
      border-bottom: 1px solid var(--bordo);
      display: flex;
      padding: 0 16px;
      overflow-x: auto;
      white-space: nowrap;
      box-shadow: var(--shadow-xs);
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none; border: none;
      color: var(--testo-lt);
      padding: 14px 16px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      transition: all .2s;
      white-space: nowrap;
    }
    .nav-btn .nav-icon { font-size: 16px; }
    .nav-btn:hover { color: var(--primario); }
    .nav-btn.active { color: var(--primario); border-bottom-color: var(--primario); font-weight: 700; }

    /* Badge IN CORSO */
    .badge-live { display:inline-flex; align-items:center; gap:4px; background:rgba(212,43,43,0.1); border:1px solid rgba(212,43,43,0.3); color:var(--primario); border-radius:20px; padding:3px 10px; font-size:11px; font-weight:700; margin-right:8px; }
    .dot-live { width:6px; height:6px; border-radius:50%; background:var(--primario); animation:pulse-live 1.2s infinite; }
    @keyframes pulse-live { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── ADMIN NAV (orizzontale) ── */
    #admin-nav {
      background: #0f172a;
      border-bottom: 2px solid var(--giallo);
      display: none;
      padding: 0 16px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .admin-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none;
      color: #64748b;
      padding: 12px 14px;
      cursor: pointer; font-size: 12px;
      font-family: inherit; font-weight: 600;
      border-bottom: 2px solid transparent;
      transition: all .2s; white-space: nowrap;
    }
    .admin-btn .nav-icon { font-size:15px; }
    .admin-btn:hover { color: var(--giallo); }
    .admin-btn.active { color: var(--giallo); border-bottom-color: var(--giallo); }

    /* ── TORNEO BAR ── */
    #torneo-bar { background:#fff; border-bottom:1px solid var(--bordo); padding:6px 12px; display:none; overflow-x:auto; white-space:nowrap; }
    .torneo-btn { background:transparent; border:1px solid var(--bordo); color:var(--testo-lt); padding:4px 12px; border-radius:20px; cursor:pointer; font-size:12px; font-family:inherit; font-weight:600; margin-right:6px; transition:all .2s; }
    .torneo-btn.active { background:var(--primario); border-color:var(--primario); color:white; }

    /* ── CAT BAR ── */
    #cat-bar { background:#fff; border-bottom:1px solid var(--bordo); padding:0 12px; overflow-x:auto; white-space:nowrap; display:flex; align-items:center; min-height:42px; }
    .cat-pill { display:inline-block; background:transparent; border:none; color:var(--testo-xs); padding:8px 12px; cursor:pointer; font-size:12px; font-family:inherit; font-weight:600; border-bottom:2px solid transparent; transition:all .2s; white-space:nowrap; }
    .cat-pill.active { color:var(--primario); border-bottom-color:var(--primario); }
    .cat-pill.oggi-pill { color:var(--giallo); }

    /* ── GIORNATA BAR ── */
    #giornata-bar { background:var(--sfondo2); border-bottom:1px solid var(--bordo); padding:5px 12px; overflow-x:auto; white-space:nowrap; display:none; }
    .giornata-btn { background:transparent; border:1px solid var(--bordo); color:var(--testo-xs); padding:3px 10px; border-radius:14px; cursor:pointer; font-size:11px; font-family:inherit; font-weight:600; margin-right:5px; transition:all .2s; }
    .giornata-btn.active { background:var(--blu); border-color:var(--blu); color:white; }

    /* ── MAIN CONTENT ── */
    #main-content { flex:1; overflow-y:auto; padding-bottom:20px; }
    .sec { display:none; padding:14px; max-width:800px; margin:0 auto; }
    .sec.active { display:block; }

    /* ── CARDS ── */
    .card { background:#fff; border:1px solid var(--bordo); border-radius:var(--radius); padding:14px; margin-bottom:10px; box-shadow:var(--shadow-xs); }
    .card-title { font-size:14px; font-weight:700; color:var(--testo); margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .badge { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; }
    .badge-gray { background:var(--sfondo2); color:var(--testo-lt); border:1px solid var(--bordo); }
    .badge-green { background:var(--verde-bg); color:var(--verde); border:1px solid rgba(22,163,74,.2); }
    .badge-orange { background:var(--arancio-bg); color:var(--primario); border:1px solid rgba(212,43,43,.2); }
    .badge-blue { background:var(--blu-bg); color:var(--blu); border:1px solid rgba(26,79,160,.2); }

    /* ── STANDINGS TABLE ── */
    .standings-table { width:100%; border-collapse:collapse; font-size:13px; }
    .standings-table th { color:var(--testo-xs); font-size:10px; font-weight:700; text-transform:uppercase; padding:4px 6px; text-align:center; border-bottom:1px solid var(--bordo); }
    .standings-table td { padding:7px 6px; text-align:center; border-bottom:1px solid var(--bordo-lt); }
    .standings-table tr:last-child td { border-bottom:none; }
    .standings-table td:nth-child(3) { text-align:left; font-weight:600; }
    .standings-table .qualifies { background:rgba(212,43,43,0.04); }
    .standings-table .qualifies td:nth-child(3) { color:var(--primario); }
    .q-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--primario); }
    .nq-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--bordo); }
    .diff-pos { color:var(--verde); font-weight:700; }
    .diff-neg { color:var(--rosso); font-weight:700; }
    .pts-col { font-weight:800; font-size:15px; color:var(--primario); }

    /* ── LOGO SQUADRA ── */
    .team-logo { width:24px; height:24px; border-radius:50%; object-fit:contain; }
    .team-logo-sm { width:20px; height:20px; border-radius:50%; object-fit:contain; }
    .team-avatar { width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,var(--primario),var(--primario-dk)); display:inline-flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:white; text-transform:uppercase; flex-shrink:0; }
    .team-avatar-sm { width:20px; height:20px; border-radius:50%; background:linear-gradient(135deg,var(--primario),var(--primario-dk)); display:inline-flex; align-items:center; justify-content:center; font-size:8px; font-weight:800; color:white; text-transform:uppercase; flex-shrink:0; }

    /* ── MATCH RESULT ── */
    .match-result { padding:8px 0; border-bottom:1px solid var(--bordo-lt); }
    .match-result:last-child { border-bottom:none; }
    .match-meta-time { font-size:11px; font-weight:700; color:var(--giallo); background:rgba(245,168,0,0.1); border-radius:4px; padding:1px 6px; }
    .match-meta-field { font-size:11px; color:var(--testo-xs); }
    .match-meta-girone { font-size:11px; color:var(--testo-xs); }
    .match-meta-author { font-size:10px; color:var(--testo-xs); margin-left:auto; }
    .match-team { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; flex:1; }
    .match-team.right { flex-direction:row-reverse; text-align:right; }
    .match-score { font-size:20px; font-weight:800; color:var(--testo); min-width:54px; text-align:center; }
    .match-score.pending { color:var(--testo-xs); font-size:13px; font-weight:600; }
    .match-scorers { margin-top:5px; display:flex; flex-wrap:wrap; gap:4px; }
    .scorer-chip { font-size:11px; background:var(--sfondo2); border:1px solid var(--bordo); border-radius:10px; padding:2px 8px; color:var(--testo-lt); }

    /* ── SECTION LABEL ── */
    .section-label { font-size:11px; font-weight:700; color:var(--testo-xs); text-transform:uppercase; letter-spacing:.08em; margin:14px 0 8px; display:flex; align-items:center; gap:8px; }
    .section-label::after { content:''; flex:1; height:1px; background:var(--bordo); }

    /* ── ADMIN MATCH ── */
    .admin-match { background:#fff; border:1px solid var(--bordo); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:8px; box-shadow:var(--shadow-xs); }
    .admin-match-header { display:flex; flex-direction:column; gap:6px; }
    .admin-team-name { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; flex:1; }
    .score-input { width:44px; height:36px; text-align:center; font-size:18px; font-weight:800; border:2px solid var(--bordo); border-radius:8px; background:var(--sfondo); color:var(--testo); font-family:inherit; }
    .score-input:focus { border-color:var(--primario); outline:none; }
    .score-dash { color:var(--testo-xs); font-size:16px; }
    .match-actions { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-left:auto; }
    .btn { padding:8px 16px; border-radius:var(--radius-sm); border:none; cursor:pointer; font-size:13px; font-weight:700; font-family:inherit; transition:all .2s; }
    .btn-p { background:var(--primario); color:white; }
    .btn-p:hover { background:var(--primario-dk); }
    .btn-sm { padding:5px 10px; font-size:12px; }
    .btn-secondary { background:var(--sfondo2); color:var(--testo); border:1px solid var(--bordo); }
    .btn-danger { background:#fef2f2; color:var(--rosso); border:1px solid rgba(220,38,38,.2); }
    .btn-accent { background:rgba(245,168,0,0.1); color:#b07800; border:1px solid rgba(245,168,0,.3); }
    .btn-success { background:var(--verde-bg); color:var(--verde); border:1px solid rgba(22,163,74,.2); }
    .scorers-section { padding:10px 0 0; border-top:1px solid var(--bordo-lt); margin-top:8px; }
    .scorer-row { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
    .scorer-row select,.scorer-row input { background:#fff; border:1px solid var(--bordo); color:var(--testo); border-radius:6px; padding:5px 8px; font-size:12px; font-family:inherit; }
    .scorer-row .min-input { width:52px; }
    .add-scorer-btn { background:var(--sfondo2); border:1.5px dashed var(--bordo); color:var(--testo-lt); border-radius:7px; padding:5px 14px; font-size:12px; cursor:pointer; font-family:inherit; width:100%; margin-top:4px; }

    /* ── FORM ── */
    .form-input { width:100%; background:#fff; border:1.5px solid var(--bordo); color:var(--testo); padding:9px 12px; border-radius:var(--radius-sm); font-size:13px; font-family:inherit; outline:none; transition:border-color .2s; }
    .form-input:focus { border-color:var(--primario); }
    .form-label { display:block; font-size:11px; color:var(--testo-lt); margin-bottom:4px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
    .form-group { margin-bottom:14px; }
    .form-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    /* ── LOGHI ADMIN ── */
    .logo-team-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--bordo-lt); }
    .logo-upload-btn { position:relative; cursor:pointer; flex-shrink:0; }
    .logo-upload-btn input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }
    .logo-plus { position:absolute; bottom:-2px; right:-2px; width:16px; height:16px; background:var(--primario); border-radius:50%; display:flex; align-items:center; justify-content:center; }

    /* ── RIEPILOGO BANNER ── */
    .riepilogo-banner { display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid var(--bordo); border-radius:var(--radius); padding:12px 16px; margin-bottom:10px; width:100%; cursor:pointer; font-family:inherit; color:var(--testo); gap:10px; box-shadow:var(--shadow-xs); }
    .riepilogo-banner:hover { border-color:var(--primario); }
    .riepilogo-banner-left { display:flex; align-items:center; gap:10px; }
    .riepilogo-banner-icon { font-size:28px; }
    .riepilogo-banner-title { font-size:14px; font-weight:700; }
    .riepilogo-banner-sub { font-size:11px; color:var(--testo-xs); }
    .riepilogo-banner-arrow { font-size:18px; color:var(--primario); }

    /* ── EMPTY STATE ── */
    .empty-state { text-align:center; padding:40px 20px; color:var(--testo-xs); font-size:14px; }

    /* ── FOOTER ── */
    .footer-credits { text-align:center; padding:20px; font-size:12px; color:var(--testo-xs); border-top:1px solid var(--bordo); margin-top:20px; }
    .footer-credits a { color:var(--primario); text-decoration:none; }

    /* ── TOAST ── */
    #toast { position:fixed; top:70px; left:50%; transform:translateX(-50%) translateY(-20px); background:#1e293b; color:white; padding:10px 20px; border-radius:10px; font-size:13px; font-weight:600; z-index:9999; opacity:0; transition:all .3s; pointer-events:none; white-space:nowrap; max-width:90vw; box-shadow:0 4px 20px rgba(0,0,0,0.2); }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--bordo); border-radius:2px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--primario); }

    /* ── RESPONSIVE ── */
    @media (max-width:600px) {
      .sec { padding:10px; }
      .nav-btn { padding:12px 10px; font-size:12px; }
    }
  </style>

</style>

<body>

<!-- Loading -->
<div id="loading-screen">
  <img id="loading-img" src="" alt="">
  <img src="logo.png" style="width:220px;max-width:80vw;object-fit:contain;margin-bottom:10px;" onerror="this.style.display='none';document.getElementById('load-emoji').style.display='block'">
  <div id="load-emoji" style="font-size:64px;display:none;animation:bounce 1.2s ease-in-out infinite;">🦁</div>
  <div class="load-title">MC LION TROPHY 2026</div>
  <div class="load-sub">11° Trofeo Valle d'Aosta Calcio</div>
  <div class="load-bar"><div class="load-bar-fill"></div></div>
</div>

<!-- Main app -->
<div id="main-app">

  <!-- Header rosso MC Lion -->
  <div class="app-header">

<script>
// ============================================================
//  TV.JS — MC LION TROPHY 2026
//  Modalità TV: scorre categorie/classifiche/risultati
//  + notifica aggiornamento risultati
// ============================================================

let TV_MODE = false;
let TV_INTERVAL = null;
let TV_CAT_INDEX = 0;
let TV_GIRONE_INDEX = 0;  // Indice del girone corrente
let TV_SECTION_INDEX = 0;
const TV_SECTIONS = ['classifiche', 'risultati'];
const TV_DURATION = 12000; // 12s per girone
let TV_GIRONI_CACHE = []; // Cache gironi categoria corrente

// ── Notifica aggiornamento risultati ─────────────────────────
let _lastRisultatiHash = '';

function _hashRisultati(gironi) {
  return gironi.map(g =>
    g.partite.filter(p=>p.giocata).map(p=>`${p.id}:${p.gol_home}-${p.gol_away}`).join(',')
  ).join('|');
}

function _mostraNotificaTVGol(testo) {
  const old = document.getElementById('tv-gol-notifica');
  if (old) old.remove();
  const div = document.createElement('div');
  div.id = 'tv-gol-notifica';
  div.innerHTML = `<div style="
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:linear-gradient(135deg,#D42B2B,#A81E1E);
    color:white;padding:28px 48px;border-radius:20px;
    font-size:32px;font-weight:900;z-index:99999;
    box-shadow:0 8px 40px rgba(212,43,43,0.7);
    border:3px solid #F5A800;
    text-align:center;letter-spacing:1px;
    animation:tvGolPop 0.3s ease-out;
  ">⚽ ${testo}</div>`;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 2500);
}

// ── Attiva/disattiva TV ───────────────────────────────────────
function toggleTVMode() { TV_MODE ? exitTVMode() : enterTVMode(); }

function enterTVMode() {
  TV_MODE = true; TV_CAT_INDEX = 0; TV_SECTION_INDEX = 0;
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  document.body.classList.add('tv-active');
  creaOverlayTV();
  avviaAutoScorrimento();
  // Controlla aggiornamenti ogni 10s
  TV_CHECK_INTERVAL = setInterval(async () => {
    if (!TV_MODE || !STATE.activeCat) return;
    try {
      const gironi = await getGironiWithData(STATE.activeCat);
      const hash = _hashRisultati(gironi);
      if (_lastRisultatiHash && hash !== _lastRisultatiHash) {
        // Trova il risultato nuovo
        for (const g of gironi) {
          for (const p of g.partite.filter(p=>p.giocata)) {
            const oldKey = `${p.id}:${p.gol_home}-${p.gol_away}`;
            if (_lastRisultatiHash.includes(p.id) && !_lastRisultatiHash.includes(oldKey)) {
              const nomeH = p.home?.nome || '?';
              const nomeA = p.away?.nome || '?';
              _mostraNotificaTVGol(`GOAL! ${nomeH} ${p.gol_home} — ${p.gol_away} ${nomeA}`);
              break;
            }
          }
        }
        _lastRisultatiHash = hash;
        renderTV(); // Aggiorna schermata
      } else if (!_lastRisultatiHash) {
        _lastRisultatiHash = hash;
      }
    } catch(e) {}
  }, 10000);
  const btn = document.getElementById('tv-btn');
  if (btn) { btn.textContent = '✕ Esci TV'; btn.style.background='rgba(212,43,43,0.3)'; }
}

let TV_CHECK_INTERVAL = null;

function exitTVMode() {
  TV_MODE = false;
  if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  document.body.classList.remove('tv-active');
  document.getElementById('tv-overlay')?.remove();
  document.getElementById('tv-gol-notifica')?.remove();
  if (TV_INTERVAL) { clearInterval(TV_INTERVAL); TV_INTERVAL = null; }
  if (TV_CHECK_INTERVAL) { clearInterval(TV_CHECK_INTERVAL); TV_CHECK_INTERVAL = null; }
  const btn = document.getElementById('tv-btn');
  if (btn) { btn.textContent = '📺 TV'; btn.style.background=''; }
}

// ── Crea overlay TV ───────────────────────────────────────────
function creaOverlayTV() {
  document.getElementById('tv-overlay')?.remove();
  const overlay = document.createElement('div');
  overlay.id = 'tv-overlay';
  overlay.innerHTML = `
    <div id="tv-header">
      <div id="tv-logo-area">
        <img id="tv-logo-img" style="display:none;width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid #F5A800;" alt="">
        <div>
          <div id="tv-titolo">🦁 MC LION TROPHY</div>
          <div id="tv-sottotitolo" style="font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px;">12-13-14 Giugno 2026 · Valle d'Aosta</div>
        </div>
      </div>
      <div id="tv-info">
        <div id="tv-live-badge">● LIVE</div>
        <div id="tv-orologio">--:--</div>
      </div>
    </div>
    <div id="tv-cat-tabs"></div>
    <div id="tv-content"></div>
    <div id="tv-footer">
      <div id="tv-cat-nome"></div>
      <div id="tv-progress-bar"><div id="tv-progress-inner"></div></div>
      <button onclick="exitTVMode()" id="tv-exit-btn">✕ Esci</button>
    </div>`;
  document.body.appendChild(overlay);

  // Orologio
  const tickOrologio = () => {
    const el = document.getElementById('tv-orologio');
    if (el) el.textContent = new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  };
  tickOrologio();
  setInterval(tickOrologio, 1000);

  // Logo
  const hl = document.getElementById('header-logo');
  if (hl?.src?.length > 50) {
    const tl = document.getElementById('tv-logo-img');
    tl.src = hl.src; tl.style.display = 'block';
  }

  // Titolo da config
  if (typeof CONFIG !== 'undefined' && CONFIG.NOME_SITO) {
    const el = document.getElementById('tv-titolo');
    if (el) el.textContent = CONFIG.NOME_SITO;
  }

  // Tab categorie
  _renderTVCatTabs();
  renderTV();
}

function _renderTVCatTabs() {
  const el = document.getElementById('tv-cat-tabs');
  if (!el || !STATE.categorie?.length) return;
  el.innerHTML = STATE.categorie.map((c, i) =>
    `<button onclick="TV_CAT_INDEX=${i};TV_SECTION_INDEX=0;renderTV();avviaProgressBar();"
      style="background:${i===TV_CAT_INDEX?'rgba(212,43,43,0.4)':'transparent'};
             border:1px solid ${i===TV_CAT_INDEX?'#D42B2B':'rgba(255,255,255,0.1)'};
             color:${i===TV_CAT_INDEX?'white':'rgba(255,255,255,0.4)'};
             padding:5px 14px;border-radius:20px;cursor:pointer;font-family:inherit;
             font-size:12px;font-weight:700;">${c.nome}</button>`
  ).join('');
}

// ── Auto scorrimento ──────────────────────────────────────────
function avviaAutoScorrimento() {
  if (TV_INTERVAL) clearInterval(TV_INTERVAL);
  avviaProgressBar();
  TV_INTERVAL = setInterval(prossimaSchermataTv, TV_DURATION);
}

function avviaProgressBar() {
  const bar = document.getElementById('tv-progress-inner');
  if (!bar) return;
  bar.style.transition = 'none'; bar.style.width = '0%';
  setTimeout(() => { bar.style.transition = `width ${TV_DURATION}ms linear`; bar.style.width = '100%'; }, 50);
}

async function prossimaSchermataTv() {
  if (!STATE.categorie?.length) return;

  // Carica gironi se necessario
  if (!TV_GIRONI_CACHE.length) {
    const cat = STATE.categorie[TV_CAT_INDEX];
    if (cat) TV_GIRONI_CACHE = await getGironiWithData(cat.id);
  }

  TV_GIRONE_INDEX++;

  // Calcola totale schermate: ogni sezione x ogni girone
  const totGironi = TV_GIRONI_CACHE.length || 1;
  const totSchermate = TV_SECTIONS.length * totGironi;
  const schermataCorrente = TV_SECTION_INDEX * totGironi + TV_GIRONE_INDEX;

  if (TV_GIRONE_INDEX >= totGironi) {
    TV_GIRONE_INDEX = 0;
    TV_SECTION_INDEX++;
    if (TV_SECTION_INDEX >= TV_SECTIONS.length) {
      TV_SECTION_INDEX = 0;
      TV_CAT_INDEX = (TV_CAT_INDEX + 1) % STATE.categorie.length;
      TV_GIRONI_CACHE = []; // Reset cache per nuova categoria
    }
  }

  _renderTVCatTabs();
  renderTV();
  avviaProgressBar();
}

// ── Render principale TV ──────────────────────────────────────
async function renderTV() {
  if (!TV_MODE) return;
  const cat = STATE.categorie[TV_CAT_INDEX];
  const section = TV_SECTIONS[TV_SECTION_INDEX];
  if (!cat) return;

  // Carica gironi se cache vuota
  if (!TV_GIRONI_CACHE.length) {
    TV_GIRONI_CACHE = await getGironiWithData(cat.id);
  }

  const gironi = TV_GIRONI_CACHE;
  const g = gironi[TV_GIRONE_INDEX] || gironi[0];
  if (!g) return;

  const catNomeEl = document.getElementById('tv-cat-nome');
  if (catNomeEl) catNomeEl.textContent = `${section==='classifiche'?'📊':'⚽'} ${cat.nome} — ${g.nome} (${TV_GIRONE_INDEX+1}/${gironi.length})`;

  const el = document.getElementById('tv-content');
  if (!el) return;
  el.style.opacity = '0';

  let html = '';

  if (section === 'classifiche') {
    // Calcola classifica del singolo girone
    const sqMap = {};
    for (const p of g.partite) {
      if (p.home?.id && p.home.nome && !/^(prima|seconda|terza|quarta|quinta|sesta|settima|ottava|nona|decima)\s/i.test(p.home.nome) && !/^\d+[°º]/.test(p.home.nome)) sqMap[p.home.id] = p.home;
      if (p.away?.id && p.away.nome && !/^(prima|seconda|terza|quarta|quinta|sesta|settima|ottava|nona|decima)\s/i.test(p.away.nome) && !/^\d+[°º]/.test(p.away.nome)) sqMap[p.away.id] = p.away;
    }
    const sq = Object.values(sqMap);
    const giocate = g.partite.filter(p=>p.giocata).length;

    if (sq.length < 2 || giocate === 0) {
      html = `<div class="tv-empty">⏳ ${g.nome} — Nessun risultato ancora</div>`;
    } else {
      const cl = calcGironeClassifica({squadre: sq, partite: g.partite});
      html = `
        <div style="font-size:18px;font-weight:900;color:#F5A800;text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid rgba(245,168,0,0.3);">
          ${g.nome} <span style="font-size:13px;background:rgba(245,168,0,0.15);padding:3px 10px;border-radius:20px;margin-left:8px;">${giocate}/${g.partite.length} partite</span>
        </div>
        <table class="tv-table"><thead><tr>
          <th style="width:30px"></th>
          <th style="text-align:left;font-size:12px">SQUADRA</th>
          <th>G</th><th>V</th><th>P</th><th>S</th>
          <th style="color:#4ade80">GF</th>
          <th style="color:#f87171">GS</th>
          <th>GD</th>
          <th style="color:#F5A800;font-size:14px">PT</th>
        </tr></thead><tbody>`;
      cl.forEach((row, idx) => {
        const q = idx < (cat.qualificate||1);
        const diff = row.gf - row.gs;
        html += `<tr class="${q?'tv-q':''}">
          <td style="font-size:22px;font-weight:900;color:${q?'#F5A800':'rgba(255,255,255,0.2)'}">${idx+1}</td>
          <td style="text-align:left;">
            <div style="display:flex;align-items:center;gap:8px;">
              ${logoHTML(row.sq,'sm')}
              <span style="font-size:20px;font-weight:${q?800:500};color:${q?'white':'rgba(255,255,255,0.7)'};">${row.sq.nome}</span>
              ${q?'<span style="background:#D42B2B;color:white;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px;">Q</span>':''}
            </div>
          </td>
          <td style="font-size:18px">${row.g}</td>
          <td style="font-size:18px;color:${row.v>0?'#4ade80':'rgba(255,255,255,0.5)'};font-weight:${row.v>0?700:400}">${row.v}</td>
          <td style="font-size:18px">${row.p}</td>
          <td style="font-size:18px;color:${row.s>0?'#f87171':'rgba(255,255,255,0.5)'}">${row.s}</td>
          <td style="font-size:18px;color:#4ade80;font-weight:600">${row.gf}</td>
          <td style="font-size:18px;color:#f87171;font-weight:600">${row.gs}</td>
          <td style="font-size:18px;color:${diff>0?'#4ade80':diff<0?'#f87171':'#888'};font-weight:600">${diff>0?'+':''}${diff}</td>
          <td style="font-size:28px;font-weight:900;color:#F5A800">${row.pts}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
    }
  } else {
    // Risultati del singolo girone
    const oggi = typeof _trovaGiornataOggi==='function' ? _trovaGiornataOggi(STATE._giornateDisponibili||[]) : null;
    let partite = g.partite;
    if (oggi) { const oggiP = partite.filter(p=>p.giorno===oggi); if(oggiP.length) partite=oggiP; }
    const giocate = partite.filter(p=>p.giocata);
    const daFare = partite.filter(p=>!p.giocata);

    html = `<div style="font-size:18px;font-weight:900;color:#F5A800;text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid rgba(245,168,0,0.3);">${g.nome}</div>`;

    if (giocate.length) {
      html += `<div style="font-size:12px;color:rgba(255,255,255,0.4);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">✅ RISULTATI</div><div class="tv-matches">`;
      for (const p of giocate) {
        const w1=p.gol_home>p.gol_away, w2=p.gol_away>p.gol_home;
        html+=`<div class="tv-match">
          <div class="tv-team ${w1?'tv-win':''}">${logoHTML(p.home,'sm')} <span style="font-size:19px">${p.home?.nome||'?'}</span></div>
          <div class="tv-score">${p.gol_home} — ${p.gol_away}</div>
          <div class="tv-team right ${w2?'tv-win':''}"><span style="font-size:19px">${p.away?.nome||'?'}</span> ${logoHTML(p.away,'sm')}</div>
        </div>`;
      }
      html += `</div>`;
    }
    if (daFare.length) {
      html += `<div style="font-size:12px;color:rgba(255,255,255,0.4);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:12px 0 8px;">🕐 PROGRAMMA</div><div class="tv-matches">`;
      for (const p of daFare) {
        html+=`<div class="tv-match tv-pending">
          <div class="tv-team">${logoHTML(p.home,'sm')} <span style="font-size:19px">${p.home?.nome||'?'}</span></div>
          <div class="tv-score tv-vs">${p.orario||'vs'}</div>
          <div class="tv-team right"><span style="font-size:19px">${p.away?.nome||'?'}</span> ${logoHTML(p.away,'sm')}</div>
        </div>`;
      }
      html += `</div>`;
    }
    if (!giocate.length && !daFare.length) html += '<div class="tv-empty">⏳ Nessuna partita</div>';
  }

  el.innerHTML = html;
  setTimeout(() => { el.style.transition='opacity 0.5s ease'; el.style.opacity='1'; }, 30);
}

</style>`);async function _renderTV(){
  if(!TV_MODE) return;
  const cat=STATE.categorie[TV_CI];
  if(!cat) return;
  if(!TV_GIRONI.length) TV_GIRONI=await getGironiWithData(cat.id);

  const body=document.getElementById('tvo-body');
  const label=document.getElementById('tvo-label');
  if(!body) return;

  // Prende 4 gironi dalla posizione corrente
  const slice=TV_GIRONI.slice(TV_GI, TV_GI+TV_PER_PAG);
  const totPag=Math.ceil(TV_GIRONI.length/TV_PER_PAG);
  const pagCorrente=Math.floor(TV_GI/TV_PER_PAG)+1;
  const sez=TV_SI===0?'📊 Classifica':'⚽ Risultati';
  if(label) label.textContent=`${sez} — ${cat.nome} — Pag ${pagCorrente}/${totPag}`;

  body.style.opacity='0';
  let html='';

  if(TV_SI===0){
    // CLASSIFICA: griglia 2x2 con 4 gironi
    html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%;">';
    for(const g of slice){
      const giocate=g.partite.filter(p=>p.giocata).length;
      const sqMap={};
      g.partite.forEach(p=>{
        if(p.home?.id&&!_tvIsPlaceholder(p.home.nome)) sqMap[p.home.id]=p.home;
        if(p.away?.id&&!_tvIsPlaceholder(p.away.nome)) sqMap[p.away.id]=p.away;
      });
      const sq=Object.values(sqMap);
      html+=`<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px;overflow:hidden;">`;
      html+=`<div style="font-size:14px;font-weight:900;color:#F5A800;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:8px;">${g.nome}<span style="font-size:11px;background:rgba(245,168,0,0.12);padding:2px 8px;border-radius:20px;">${giocate}/${g.partite.length}</span></div>`;
      if(sq.length<2||giocate===0){
        html+=`<div style="color:rgba(255,255,255,0.2);font-size:14px;padding:10px 0;">⏳ Nessun risultato</div>`;
      } else {
        const cl=calcGironeClassifica({squadre:sq,partite:g.partite});
        html+=`<table style="width:100%;border-collapse:collapse;font-size:15px;">
          <thead><tr>
            <th style="color:rgba(255,255,255,.3);font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">#</th>
            <th style="color:rgba(255,255,255,.3);font-size:10px;padding:3px 4px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);">SQUADRA</th>
            <th style="color:rgba(255,255,255,.3);font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">G</th>
            <th style="color:rgba(255,255,255,.3);font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">V</th>
            <th style="color:rgba(255,255,255,.3);font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">P</th>
            <th style="color:rgba(255,255,255,.3);font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">S</th>
            <th style="color:#4ade80;font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">GF</th>
            <th style="color:#f87171;font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">GS</th>
            <th style="color:rgba(255,255,255,.3);font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">GD</th>
            <th style="color:#F5A800;font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">PT</th>
          </tr></thead><tbody>`;
        cl.forEach((row,i)=>{
          const q=i<(cat.qualificate||1);
          const d=row.gf-row.gs;
          html+=`<tr style="background:${q?'rgba(212,43,43,0.08)':'transparent'}">
            <td style="padding:6px 4px;text-align:center;font-weight:900;color:${q?'#F5A800':'rgba(255,255,255,0.25)'};">${i+1}</td>
            <td style="padding:6px 4px;text-align:left;">
              <div style="display:flex;align-items:center;gap:6px;">
                ${logoHTML(row.sq,'sm')}
                <span style="font-size:15px;font-weight:${q?700:400};color:${q?'white':'rgba(255,255,255,0.75)'};">${row.sq.nome}</span>
              </div>
            </td>
            <td style="padding:6px 4px;text-align:center;color:rgba(255,255,255,0.7);">${row.g}</td>
            <td style="padding:6px 4px;text-align:center;color:${row.v>0?'#4ade80':'rgba(255,255,255,0.5)'};font-weight:${row.v>0?700:400}">${row.v}</td>
            <td style="padding:6px 4px;text-align:center;color:rgba(255,255,255,0.7);">${row.p}</td>
            <td style="padding:6px 4px;text-align:center;color:${row.s>0?'#f87171':'rgba(255,255,255,0.5)'};">${row.s}</td>
            <td style="padding:6px 4px;text-align:center;color:#4ade80;font-weight:600;">${row.gf}</td>
            <td style="padding:6px 4px;text-align:center;color:#f87171;font-weight:600;">${row.gs}</td>
            <td style="padding:6px 4px;text-align:center;color:${d>0?'#4ade80':d<0?'#f87171':'#888'};font-weight:600;">${d>0?'+':''}${d}</td>
            <td style="padding:6px 4px;text-align:center;font-size:20px;font-weight:900;color:#F5A800;">${row.pts}</td>
          </tr>`;
        });
        html+=`</tbody></table>`;
      }
      html+=`</div>`;
    }
    html+='</div>';

  } else {
    // RISULTATI: 4 gironi in griglia 2x2
    html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%;">';
    for(const g of slice){
      html+=`<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px;overflow:hidden;">`;
      html+=`<div style="font-size:14px;font-weight:900;color:#F5A800;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">${g.nome}</div>`;
      const giocate=g.partite.filter(p=>p.giocata);
      const daFare=g.partite.filter(p=>!p.giocata);
      if(giocate.length){
        giocate.forEach(p=>{
          const w1=p.gol_home>p.gol_away,w2=p.gol_away>p.gol_home;
          html+=`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
            <div style="flex:1;font-size:14px;font-weight:${w1?700:400};color:${w1?'#D42B2B':'rgba(255,255,255,0.8)'};display:flex;align-items:center;gap:5px;">${logoHTML(p.home,'sm')} ${p.home?.nome||'?'}</div>
            <div style="font-size:18px;font-weight:900;color:white;min-width:60px;text-align:center;background:rgba(212,43,43,0.2);border-radius:6px;padding:2px 8px;">${p.gol_home} — ${p.gol_away}</div>
            <div style="flex:1;font-size:14px;font-weight:${w2?700:400};color:${w2?'#D42B2B':'rgba(255,255,255,0.8)'};display:flex;align-items:center;gap:5px;flex-direction:row-reverse;">${logoHTML(p.away,'sm')} ${p.away?.nome||'?'}</div>
          </div>`;
        });
      }
      if(daFare.length){
        daFare.slice(0,3).forEach(p=>{
          html+=`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03);">
            <div style="flex:1;font-size:13px;color:rgba(255,255,255,0.5);display:flex;align-items:center;gap:5px;">${logoHTML(p.home,'sm')} ${p.home?.nome||'?'}</div>
            <div style="font-size:12px;color:rgba(255,255,255,0.3);min-width:60px;text-align:center;">${p.orario||'vs'}</div>
            <div style="flex:1;font-size:13px;color:rgba(255,255,255,0.5);display:flex;align-items:center;gap:5px;flex-direction:row-reverse;">${logoHTML(p.away,'sm')} ${p.away?.nome||'?'}</div>
          </div>`;
        });
      }
      if(!giocate.length&&!daFare.length) html+=`<div style="color:rgba(255,255,255,0.2);font-size:13px;padding:10px 0;">⏳ Nessuna partita</div>`;
      html+=`</div>`;
    }
    html+='</div>';
  }

  body.innerHTML=html;
  setTimeout(()=>{ body.style.transition='opacity 0.4s'; body.style.opacity='1'; },30);
}



</script>
