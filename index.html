<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#B81C1C">
  <title>🦁 MC Lion Trophy 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      /* Colori MC Lion */
      --red:        #C41E1E;
      --red-dk:     #8B1010;
      --red-lt:     #E53535;
      --gold:       #F5A800;
      --gold-lt:    #FFD04D;
      --gold-dk:    #C78600;
      --white:      #FFFFFF;
      --off-white:  #FDF8F2;
      /* UI */
      --bg:         #F7F4F0;
      --bg2:        #EDE9E3;
      --surface:    #FFFFFF;
      --border:     #E0D8CF;
      --border-lt:  #F0EBE4;
      --text:       #1A1208;
      --text-2:     #4A3F30;
      --text-3:     #8C7D6B;
      --text-4:     #B8A898;
      /* Stati */
      --green:      #16A34A;
      --green-bg:   #F0FDF4;
      --blue:       #1E40AF;
      --blue-bg:    #EFF6FF;
      --orange:     #EA580C;
      /* Effetti */
      --shadow-sm:  0 1px 3px rgba(0,0,0,.08);
      --shadow:     0 2px 8px rgba(0,0,0,.10);
      --shadow-lg:  0 8px 24px rgba(0,0,0,.14);
      --shadow-red: 0 4px 20px rgba(196,30,30,.25);
      --radius:     14px;
      --radius-sm:  9px;
      --font-head:  'Barlow Condensed', sans-serif;
      --font-body:  'Barlow', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ── LOADING ─────────────────────────────────────── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0;
      background: linear-gradient(160deg, #8B1010 0%, #C41E1E 45%, #D42B2B 70%, #B81C1C 100%);
    }
    #loading-screen::before {
      content: '';
      position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23FFFFFF' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }
    .load-logo-wrap {
      position: relative;
      margin-bottom: 24px;
      animation: loadBounce 1.4s ease-in-out infinite;
    }
    @keyframes loadBounce {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.04); }
    }
    #loading-img {
      width: 130px; height: 130px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,.4));
    }
    #load-emoji { font-size: 80px; }
    .load-title {
      font-family: var(--font-head);
      font-size: 28px; font-weight: 900;
      color: white; letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0,0,0,.3);
      margin-bottom: 6px;
    }
    .load-sub {
      font-size: 13px; color: rgba(255,255,255,.6);
      letter-spacing: 1px; text-transform: uppercase;
      margin-bottom: 28px;
    }
    .load-bar {
      width: 140px; height: 3px;
      background: rgba(255,255,255,.15);
      border-radius: 2px; overflow: hidden;
    }
    .load-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-lt));
      border-radius: 2px;
      animation: loadbar 1.5s ease-in-out infinite;
    }
    @keyframes loadbar {
      0% { width:0; margin-left:0; }
      50% { width:70%; margin-left:15%; }
      100% { width:0; margin-left:100%; }
    }
    #loading-img { display: block; }

    /* ── MAIN APP ────────────────────────────────────── */
    #main-app { display: none; flex-direction: column; min-height: 100vh; }

    /* ── HEADER ──────────────────────────────────────── */
    .app-header {
      background: linear-gradient(135deg, var(--red-dk) 0%, var(--red) 50%, var(--red-lt) 100%);
      border-bottom: 3px solid var(--gold);
      padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 200;
      min-height: 58px;
      box-shadow: var(--shadow-red);
    }
    .app-header::after {
      content: '';
      position: absolute; bottom: -3px; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-lt), transparent);
    }
    .header-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    #header-logo {
      width: 38px; height: 38px;
      object-fit: contain; border-radius: 6px;
      display: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.3));
    }
    .header-text { min-width: 0; }
    #header-title {
      font-family: var(--font-head);
      font-size: 19px; font-weight: 900;
      color: white; letter-spacing: 0.5px;
      text-shadow: 0 1px 4px rgba(0,0,0,.3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #header-date {
      font-size: 10px; color: rgba(255,255,255,.6);
      letter-spacing: 0.5px; margin-top: 1px;
    }
    .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .header-right button {
      border: 1.5px solid rgba(255,255,255,.25);
      color: rgba(255,255,255,.92);
      padding: 6px 12px; border-radius: 20px;
      cursor: pointer; font-size: 11px;
      font-family: var(--font-body); font-weight: 700;
      letter-spacing: 0.3px;
      transition: all .2s; white-space: nowrap;
    }
    #tv-btn { background: rgba(0,0,0,.2); }
    #tv-btn:hover { background: rgba(0,0,0,.4); }
    #admin-btn { background: rgba(245,168,0,.15); border-color: rgba(245,168,0,.4); color: var(--gold-lt); }
    #admin-btn:hover { background: rgba(245,168,0,.3); }

    .badge-live {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(245,168,0,.15);
      border: 1.5px solid rgba(245,168,0,.4);
      color: var(--gold-lt);
      border-radius: 20px; padding: 4px 10px;
      font-size: 10px; font-weight: 800;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .dot-live {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold);
      animation: pulse-live 1.2s infinite;
    }
    @keyframes pulse-live { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(0.8)} }

    /* ── NAV PUBBLICA ────────────────────────────────── */
    #pub-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: stretch;
      padding: 0 4px;
      box-shadow: var(--shadow-sm);
      position: sticky; top: 58px; z-index: 190;
    }
    .nav-btn {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px;
      background: none; border: none;
      color: var(--text-3);
      padding: 10px 8px;
      cursor: pointer;
      font-size: 10px; font-weight: 700;
      font-family: var(--font-body);
      letter-spacing: 0.3px; text-transform: uppercase;
      border-bottom: 2px solid transparent;
      transition: all .2s;
    }
    .nav-btn .nav-icon { font-size: 18px; line-height: 1; }
    .nav-btn:hover { color: var(--red); }
    .nav-btn.active {
      color: var(--red);
      border-bottom-color: var(--red);
      background: linear-gradient(to bottom, transparent, rgba(196,30,30,.04));
    }

    /* ── ADMIN NAV ───────────────────────────────────── */
    #admin-nav {
      background: #14080A;
      border-bottom: 2px solid var(--gold);
      display: none; align-items: stretch;
      padding: 0 4px;
      position: sticky; top: 58px; z-index: 190;
      overflow-x: auto; white-space: nowrap;
    }
    .admin-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: none; border: none;
      color: rgba(255,255,255,.4);
      padding: 12px 14px;
      cursor: pointer; font-size: 12px;
      font-family: var(--font-body); font-weight: 700;
      border-bottom: 2px solid transparent;
      transition: all .2s; white-space: nowrap;
    }
    .admin-btn .nav-icon { font-size: 14px; }
    .admin-btn:hover { color: var(--gold); }
    .admin-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* ── CAT BAR ─────────────────────────────────────── */
    #cat-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 12px;
      overflow-x: auto; white-space: nowrap;
      display: flex; align-items: center;
      min-height: 40px; gap: 4px;
      scrollbar-width: none;
    }
    #cat-bar::-webkit-scrollbar { display: none; }
    .cat-pill {
      display: inline-block;
      background: transparent; border: none;
      color: var(--text-3);
      padding: 6px 12px;
      cursor: pointer; font-size: 12px;
      font-family: var(--font-body); font-weight: 700;
      border-bottom: 2px solid transparent;
      transition: all .2s; white-space: nowrap; border-radius: 0;
    }
    .cat-pill.active { color: var(--red); border-bottom-color: var(--red); }
    .cat-bar-inner { display: flex; align-items: center; gap: 4px; width: 100%; }

    /* ── TORNEO BAR ──────────────────────────────────── */
    #torneo-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px; display: none;
    }

    /* ── CONTENT ─────────────────────────────────────── */
    #main-content {
      flex: 1; padding: 12px 12px 80px;
      max-width: 720px; margin: 0 auto; width: 100%;
    }

    /* ── CARD ────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s;
    }
    .card:hover { box-shadow: var(--shadow); }
    .card-title {
      font-family: var(--font-head);
      font-size: 15px; font-weight: 800;
      color: var(--text);
      letter-spacing: 0.5px; text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-lt);
    }
    .card-title::before {
      content: '';
      width: 4px; height: 16px;
      background: linear-gradient(to bottom, var(--red), var(--gold));
      border-radius: 2px; flex-shrink: 0;
    }

    /* ── SEZIONE LABEL ───────────────────────────────── */
    .section-label {
      font-family: var(--font-head);
      font-size: 11px; font-weight: 800;
      color: var(--text-3);
      text-transform: uppercase; letter-spacing: 1.5px;
      padding: 8px 0 6px;
      display: flex; align-items: center; gap: 10px;
    }
    .section-label::after {
      content: ''; flex: 1; height: 1px;
      background: var(--border);
    }

    /* ── BADGE ───────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 20px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.3px;
    }
    .badge-gray { background: var(--bg2); color: var(--text-3); }
    .badge-green { background: var(--green-bg); color: var(--green); }
    .badge-blue { background: var(--blue-bg); color: var(--blue); }

    /* ── CLASSIFICA ──────────────────────────────────── */
    .standings-table {
      width: 100%; border-collapse: collapse;
      font-size: 13px;
    }
    .standings-table thead tr {
      background: var(--bg);
    }
    .standings-table th {
      font-size: 9px; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--text-4);
      padding: 6px 4px; text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .standings-table td {
      padding: 9px 4px; text-align: center;
      color: var(--text-2);
      border-bottom: 1px solid var(--border-lt);
      font-size: 13px;
    }
    .standings-table tr:last-child td { border-bottom: none; }
    .standings-table tr.qualifies { background: rgba(196,30,30,.04); }
    .standings-table tr.qualifies td { color: var(--text); }
    .q-dot {
      display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; background: var(--red);
      box-shadow: 0 0 0 2px rgba(196,30,30,.2);
    }
    .nq-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
    .diff-pos { color: var(--green); font-weight: 700; }
    .diff-neg { color: var(--red); font-weight: 700; }
    .pts-col {
      font-family: var(--font-head);
      font-size: 16px; font-weight: 900;
      color: var(--red);
    }

    /* Logo squadra */
    .team-logo { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
    .team-logo-sm { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }
    .team-avatar {
      width: 24px; height: 24px; border-radius: 50%;
      background: linear-gradient(135deg, var(--red), var(--gold));
      color: white; font-size: 8px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .team-avatar-sm {
      width: 20px; height: 20px; border-radius: 50%;
      background: linear-gradient(135deg, var(--red), var(--gold));
      color: white; font-size: 7px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* ── RISULTATI ───────────────────────────────────── */
    .match-result {
      padding: 12px 0;
      border-bottom: 1px solid var(--border-lt);
    }
    .match-result:last-child { border-bottom: none; }
    .match-meta-time {
      font-size: 11px; font-weight: 700;
      color: var(--red); background: rgba(196,30,30,.08);
      padding: 2px 7px; border-radius: 6px;
    }
    .match-meta-field {
      font-size: 11px; color: var(--text-3);
      background: var(--bg); padding: 2px 7px; border-radius: 6px;
    }
    .match-meta-girone {
      font-size: 11px; color: var(--text-4);
    }
    .match-meta-author {
      font-size: 10px; color: var(--text-4);
      margin-left: auto;
    }
    .match-team {
      flex: 1; display: flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 600; color: var(--text);
      min-width: 0;
    }
    .match-team span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .match-team.right { flex-direction: row-reverse; text-align: right; }
    .match-score {
      font-family: var(--font-head);
      font-size: 20px; font-weight: 900;
      color: var(--text);
      min-width: 70px; text-align: center;
      background: var(--bg); border-radius: 10px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .match-score.pending {
      color: var(--text-4); font-size: 14px;
      background: transparent; border-color: transparent;
    }
    .match-scorers {
      display: flex; flex-wrap: wrap; gap: 4px;
      margin-top: 8px; padding-left: 27px;
    }
    .scorer-chip {
      font-size: 10px; color: var(--text-3);
      background: var(--bg); border-radius: 20px;
      padding: 2px 8px; border: 1px solid var(--border);
    }

    /* ── TABELLONE ───────────────────────────────────── */
    /* Mantenuto uguale ma con stile aggiornato */

    /* ── ADMIN MATCH ─────────────────────────────────── */
    .admin-match {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-bottom: 8px;
      box-shadow: var(--shadow-sm);
    }
    .admin-match-header { width: 100%; }
    .admin-team-name {
      flex: 1; display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; color: var(--text);
      min-width: 0;
    }
    .admin-team-name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .admin-team-name.right { flex-direction: row-reverse; }
    .score-input {
      width: 48px; height: 42px;
      border: 2px solid var(--border); border-radius: var(--radius-sm);
      text-align: center; font-size: 20px; font-weight: 800;
      font-family: var(--font-head); color: var(--text);
      background: var(--bg);
      transition: border-color .2s;
      -moz-appearance: textfield;
    }
    .score-input:focus { outline: none; border-color: var(--red); background: white; }
    .score-input::-webkit-inner-spin-button, .score-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .score-dash { font-size: 18px; color: var(--text-4); font-weight: 300; }
    .match-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    /* ── BOTTONI ─────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 8px 14px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface); color: var(--text-2);
      font-size: 12px; font-weight: 700;
      font-family: var(--font-body); cursor: pointer;
      transition: all .15s; white-space: nowrap;
    }
    .btn:hover { background: var(--bg2); }
    .btn-p {
      background: var(--red); border-color: var(--red);
      color: white; box-shadow: 0 2px 8px rgba(196,30,30,.3);
    }
    .btn-p:hover { background: var(--red-dk); box-shadow: 0 4px 12px rgba(196,30,30,.4); }
    .btn-success { background: var(--green); border-color: var(--green); color: white; }
    .btn-danger { background: transparent; border-color: rgba(220,38,38,.3); color: var(--red); }
    .btn-danger:hover { background: rgba(220,38,38,.08); }
    .btn-accent { background: var(--bg2); border-color: var(--border); color: var(--text-2); }
    .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 7px; }

    /* ── FORM ────────────────────────────────────────── */
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; }
    .form-input {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-size: 14px; font-family: var(--font-body); color: var(--text);
      background: var(--surface); transition: border-color .2s;
    }
    .form-input:focus { outline: none; border-color: var(--red); }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

    /* ── LOGO UPLOAD ─────────────────────────────────── */
    .logo-team-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--border-lt);
    }
    .logo-team-row:last-child { border-bottom: none; }
    .logo-upload-btn {
      position: relative; width: 44px; height: 44px;
      border-radius: 50%; overflow: hidden;
      cursor: pointer; flex-shrink: 0;
      border: 2px solid var(--border);
    }
    .logo-upload-btn input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .logo-plus {
      position: absolute; bottom: 0; right: 0;
      width: 16px; height: 16px;
      background: var(--red); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid white;
    }

    /* ── SCORERS ─────────────────────────────────────── */
    .scorers-section {
      margin-top: 12px; padding-top: 12px;
      border-top: 1px solid var(--border-lt);
    }
    .scorer-row {
      display: flex; gap: 6px; margin-bottom: 6px; align-items: center;
    }
    .scorer-row select, .scorer-row input {
      border: 1.5px solid var(--border); border-radius: 7px;
      padding: 6px 8px; font-size: 12px;
      font-family: var(--font-body); color: var(--text);
      background: var(--surface);
    }
    .scorer-row select { flex: 0 0 auto; min-width: 100px; }
    .scorer-row input { flex: 1; }
    .min-input { width: 52px !important; flex: 0 0 auto !important; }
    .add-scorer-btn {
      width: 100%; padding: 8px; border: 1.5px dashed var(--border);
      background: transparent; border-radius: var(--radius-sm);
      color: var(--red); font-size: 12px; font-weight: 700;
      font-family: var(--font-body); cursor: pointer;
      margin-top: 4px; transition: background .15s;
    }
    .add-scorer-btn:hover { background: rgba(196,30,30,.05); }

    /* ── EMPTY STATE ─────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 48px 24px;
      color: var(--text-4); font-size: 14px;

    /* ── MODAL LOGIN ─────────────────────────────────── */
    #admin-modal {

    }
    @media (min-width: 480px) { .modal-handle { display: none; } }
    .modal-lion {
      text-align: center; font-size: 48px;
      margin-bottom: 6px;
    }
    .modal-title {
      font-family: var(--font-head);
      font-size: 22px; font-weight: 900;
      color: var(--text); text-align: center;
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 20px;
    }

    /* ── RIEPILOGO BANNER ────────────────────────────── */
    .riepilogo-banner {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px;
      cursor: pointer; width: 100%; margin-bottom: 14px;
      transition: all .2s; text-align: left;
      box-shadow: var(--shadow-sm);
    }
    .riepilogo-banner:hover { border-color: var(--red); box-shadow: var(--shadow); }
    .riepilogo-banner-icon { font-size: 28px; flex-shrink: 0; }
    .riepilogo-banner-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .riepilogo-banner-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .riepilogo-banner-arrow { font-size: 20px; color: var(--text-4); margin-left: auto; }

    /* ── FOOTER ──────────────────────────────────────── */
    .footer-credits {

      font-size: 11px; color: var(--text-4);

    .footer-credits a { color: var(--text-3); text-decoration: none; }

    /* ── GIORNATA BADGE ──────────────────────────────── */
    .oggi-pill { background: rgba(196,30,30,.08) !important; color: var(--red) !important; border-color: rgba(196,30,30,.25) !important; }

<script>
// ============================================================
//  TV.JS — MC LION TROPHY 2026
//  Modalità TV: scorre categorie/classifiche/risultati
//  + notifica aggiornamento risultati
// ============================================================

let TV_MODE = false;
let TV_INTERVAL = null;
let TV_CAT_INDEX = 0;
let TV_GIRONE_INDEX = 0;  // Indice del girone corrente
let TV_SECTION_INDEX = 0;
const TV_SECTIONS = ['classifiche', 'risultati'];
const TV_DURATION = 12000; // 12s per girone
let TV_GIRONI_CACHE = []; // Cache gironi categoria corrente

// ── Notifica aggiornamento risultati ─────────────────────────
let _lastRisultatiHash = '';

function _hashRisultati(gironi) {
  return gironi.map(g =>
    g.partite.filter(p=>p.giocata).map(p=>`${p.id}:${p.gol_home}-${p.gol_away}`).join(',')
  ).join('|');
}

function _mostraNotificaTVGol(testo) {
  const old = document.getElementById('tv-gol-notifica');
  if (old) old.remove();
  const div = document.createElement('div');
  div.id = 'tv-gol-notifica';
  div.innerHTML = `<div style="
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:linear-gradient(135deg,#D42B2B,#A81E1E);
    color:white;padding:28px 48px;border-radius:20px;
    font-size:32px;font-weight:900;z-index:99999;
    box-shadow:0 8px 40px rgba(212,43,43,0.7);
    border:3px solid #F5A800;
    text-align:center;letter-spacing:1px;
    animation:tvGolPop 0.3s ease-out;
  ">⚽ ${testo}</div>`;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 2500);
}

// ── Attiva/disattiva TV ───────────────────────────────────────
function toggleTVMode() { TV_MODE ? exitTVMode() : enterTVMode(); }

function enterTVMode() {
  TV_MODE = true; TV_CAT_INDEX = 0; TV_SECTION_INDEX = 0;
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  document.body.classList.add('tv-active');
  creaOverlayTV();
  avviaAutoScorrimento();
  // Controlla aggiornamenti ogni 10s
  TV_CHECK_INTERVAL = setInterval(async () => {
    if (!TV_MODE || !STATE.activeCat) return;
    try {
      const gironi = await getGironiWithData(STATE.activeCat);
      const hash = _hashRisultati(gironi);
      if (_lastRisultatiHash && hash !== _lastRisultatiHash) {
        // Trova il risultato nuovo
        for (const g of gironi) {
          for (const p of g.partite.filter(p=>p.giocata)) {
            const oldKey = `${p.id}:${p.gol_home}-${p.gol_away}`;
            if (_lastRisultatiHash.includes(p.id) && !_lastRisultatiHash.includes(oldKey)) {
              const nomeH = p.home?.nome || '?';
              const nomeA = p.away?.nome || '?';
              _mostraNotificaTVGol(`GOAL! ${nomeH} ${p.gol_home} — ${p.gol_away} ${nomeA}`);
              break;
            }
          }
        }
        _lastRisultatiHash = hash;
        renderTV(); // Aggiorna schermata
      } else if (!_lastRisultatiHash) {
        _lastRisultatiHash = hash;
      }
    } catch(e) {}
  }, 10000);
  const btn = document.getElementById('tv-btn');
  if (btn) { btn.textContent = '✕ Esci TV'; btn.style.background='rgba(212,43,43,0.3)'; }
}

let TV_CHECK_INTERVAL = null;

function exitTVMode() {
  TV_MODE = false;
  if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  document.body.classList.remove('tv-active');
  document.getElementById('tv-overlay')?.remove();
  document.getElementById('tv-gol-notifica')?.remove();
  if (TV_INTERVAL) { clearInterval(TV_INTERVAL); TV_INTERVAL = null; }
  if (TV_CHECK_INTERVAL) { clearInterval(TV_CHECK_INTERVAL); TV_CHECK_INTERVAL = null; }
  const btn = document.getElementById('tv-btn');
  if (btn) { btn.textContent = '📺 TV'; btn.style.background=''; }
}

// ── Crea overlay TV ───────────────────────────────────────────
function creaOverlayTV() {
  document.getElementById('tv-overlay')?.remove();
  const overlay = document.createElement('div');
  overlay.id = 'tv-overlay';
  overlay.innerHTML = `
    <div id="tv-header">
      <div id="tv-logo-area">
        <img id="tv-logo-img" style="display:none;width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid #F5A800;" alt="">
        <div>
          <div id="tv-titolo">🦁 MC LION TROPHY</div>
          <div id="tv-sottotitolo" style="font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px;">12-13-14 Giugno 2026 · Valle d'Aosta</div>
        </div>
      </div>
      <div id="tv-info">
        <div id="tv-live-badge">● LIVE</div>
        <div id="tv-orologio">--:--</div>
      </div>
    </div>
    <div id="tv-cat-tabs"></div>
    <div id="tv-content"></div>
    <div id="tv-footer">
      <div id="tv-cat-nome"></div>
      <div id="tv-progress-bar"><div id="tv-progress-inner"></div></div>
      <button onclick="exitTVMode()" id="tv-exit-btn">✕ Esci</button>
    </div>`;
  document.body.appendChild(overlay);

  // Orologio
  const tickOrologio = () => {
    const el = document.getElementById('tv-orologio');
    if (el) el.textContent = new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  };
  tickOrologio();
  setInterval(tickOrologio, 1000);

  // Logo
  const hl = document.getElementById('header-logo');
  if (hl?.src?.length > 50) {
    const tl = document.getElementById('tv-logo-img');
    tl.src = hl.src; tl.style.display = 'block';
  }

  // Titolo da config
  if (typeof CONFIG !== 'undefined' && CONFIG.NOME_SITO) {
    const el = document.getElementById('tv-titolo');
    if (el) el.textContent = CONFIG.NOME_SITO;
  }

  // Tab categorie
  _renderTVCatTabs();
  renderTV();
}

function _renderTVCatTabs() {
  const el = document.getElementById('tv-cat-tabs');
  if (!el || !STATE.categorie?.length) return;
  el.innerHTML = STATE.categorie.map((c, i) =>
    `<button onclick="TV_CAT_INDEX=${i};TV_SECTION_INDEX=0;renderTV();avviaProgressBar();"
      style="background:${i===TV_CAT_INDEX?'rgba(212,43,43,0.4)':'transparent'};
             border:1px solid ${i===TV_CAT_INDEX?'#D42B2B':'rgba(255,255,255,0.1)'};
             color:${i===TV_CAT_INDEX?'white':'rgba(255,255,255,0.4)'};
             padding:5px 14px;border-radius:20px;cursor:pointer;font-family:inherit;
             font-size:12px;font-weight:700;">${c.nome}</button>`
  ).join('');
}

// ── Auto scorrimento ──────────────────────────────────────────
function avviaAutoScorrimento() {
  if (TV_INTERVAL) clearInterval(TV_INTERVAL);
  avviaProgressBar();
  TV_INTERVAL = setInterval(prossimaSchermataTv, TV_DURATION);
}

function avviaProgressBar() {
  const bar = document.getElementById('tv-progress-inner');
  if (!bar) return;
  bar.style.transition = 'none'; bar.style.width = '0%';
  setTimeout(() => { bar.style.transition = `width ${TV_DURATION}ms linear`; bar.style.width = '100%'; }, 50);
}

async function prossimaSchermataTv() {
  if (!STATE.categorie?.length) return;

  // Carica gironi se necessario
  if (!TV_GIRONI_CACHE.length) {
    const cat = STATE.categorie[TV_CAT_INDEX];
    if (cat) TV_GIRONI_CACHE = await getGironiWithData(cat.id);
  }

  TV_GIRONE_INDEX++;

  // Calcola totale schermate: ogni sezione x ogni girone
  const totGironi = TV_GIRONI_CACHE.length || 1;
  const totSchermate = TV_SECTIONS.length * totGironi;
  const schermataCorrente = TV_SECTION_INDEX * totGironi + TV_GIRONE_INDEX;

  if (TV_GIRONE_INDEX >= totGironi) {
    TV_GIRONE_INDEX = 0;
    TV_SECTION_INDEX++;
    if (TV_SECTION_INDEX >= TV_SECTIONS.length) {
      TV_SECTION_INDEX = 0;
      TV_CAT_INDEX = (TV_CAT_INDEX + 1) % STATE.categorie.length;
      TV_GIRONI_CACHE = []; // Reset cache per nuova categoria
    }
  }

  _renderTVCatTabs();
  renderTV();
  avviaProgressBar();
}

// ── Render principale TV ──────────────────────────────────────
async function renderTV() {
  if (!TV_MODE) return;
  const cat = STATE.categorie[TV_CAT_INDEX];
  const section = TV_SECTIONS[TV_SECTION_INDEX];
  if (!cat) return;

  // Carica gironi se cache vuota
  if (!TV_GIRONI_CACHE.length) {
    TV_GIRONI_CACHE = await getGironiWithData(cat.id);
  }

  const gironi = TV_GIRONI_CACHE;
  const g = gironi[TV_GIRONE_INDEX] || gironi[0];
  if (!g) return;

  const catNomeEl = document.getElementById('tv-cat-nome');
  if (catNomeEl) catNomeEl.textContent = `${section==='classifiche'?'📊':'⚽'} ${cat.nome} — ${g.nome} (${TV_GIRONE_INDEX+1}/${gironi.length})`;

  const el = document.getElementById('tv-content');
  if (!el) return;
  el.style.opacity = '0';

  let html = '';

  if (section === 'classifiche') {
    // Calcola classifica del singolo girone
    const sqMap = {};
    for (const p of g.partite) {
      if (p.home?.id && p.home.nome && !/^(prima|seconda|terza|quarta|quinta|sesta|settima|ottava|nona|decima)\s/i.test(p.home.nome) && !/^\d+[°º]/.test(p.home.nome)) sqMap[p.home.id] = p.home;
      if (p.away?.id && p.away.nome && !/^(prima|seconda|terza|quarta|quinta|sesta|settima|ottava|nona|decima)\s/i.test(p.away.nome) && !/^\d+[°º]/.test(p.away.nome)) sqMap[p.away.id] = p.away;
    }
    const sq = Object.values(sqMap);
    const giocate = g.partite.filter(p=>p.giocata).length;

    if (sq.length < 2 || giocate === 0) {
      html = `<div class="tv-empty">⏳ ${g.nome} — Nessun risultato ancora</div>`;
    } else {
      const cl = calcGironeClassifica({squadre: sq, partite: g.partite});
      html = `
        <div style="font-size:18px;font-weight:900;color:#F5A800;text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid rgba(245,168,0,0.3);">
          ${g.nome} <span style="font-size:13px;background:rgba(245,168,0,0.15);padding:3px 10px;border-radius:20px;margin-left:8px;">${giocate}/${g.partite.length} partite</span>
        </div>
        <table class="tv-table"><thead><tr>
          <th style="width:30px"></th>
          <th style="text-align:left;font-size:12px">SQUADRA</th>
          <th>G</th><th>V</th><th>P</th><th>S</th>
          <th style="color:#4ade80">GF</th>
          <th style="color:#f87171">GS</th>
          <th>GD</th>
          <th style="color:#F5A800;font-size:14px">PT</th>
        </tr></thead><tbody>`;
      cl.forEach((row, idx) => {
        const q = idx < (cat.qualificate||1);
        const diff = row.gf - row.gs;
        html += `<tr class="${q?'tv-q':''}">
          <td style="font-size:22px;font-weight:900;color:${q?'#F5A800':'rgba(255,255,255,0.2)'}">${idx+1}</td>
          <td style="text-align:left;">
            <div style="display:flex;align-items:center;gap:8px;">
              ${logoHTML(row.sq,'sm')}
              <span style="font-size:20px;font-weight:${q?800:500};color:${q?'white':'rgba(255,255,255,0.7)'};">${row.sq.nome}</span>
              ${q?'<span style="background:#D42B2B;color:white;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px;">Q</span>':''}
            </div>
          </td>
          <td style="font-size:18px">${row.g}</td>
          <td style="font-size:18px;color:${row.v>0?'#4ade80':'rgba(255,255,255,0.5)'};font-weight:${row.v>0?700:400}">${row.v}</td>
          <td style="font-size:18px">${row.p}</td>
          <td style="font-size:18px;color:${row.s>0?'#f87171':'rgba(255,255,255,0.5)'}">${row.s}</td>
          <td style="font-size:18px;color:#4ade80;font-weight:600">${row.gf}</td>
          <td style="font-size:18px;color:#f87171;font-weight:600">${row.gs}</td>
          <td style="font-size:18px;color:${diff>0?'#4ade80':diff<0?'#f87171':'#888'};font-weight:600">${diff>0?'+':''}${diff}</td>
          <td style="font-size:28px;font-weight:900;color:#F5A800">${row.pts}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
    }
  } else {
    // Risultati del singolo girone
    const oggi = typeof _trovaGiornataOggi==='function' ? _trovaGiornataOggi(STATE._giornateDisponibili||[]) : null;
    let partite = g.partite;
    if (oggi) { const oggiP = partite.filter(p=>p.giorno===oggi); if(oggiP.length) partite=oggiP; }
    const giocate = partite.filter(p=>p.giocata);
    const daFare = partite.filter(p=>!p.giocata);

    html = `<div style="font-size:18px;font-weight:900;color:#F5A800;text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid rgba(245,168,0,0.3);">${g.nome}</div>`;

    if (giocate.length) {
      html += `<div style="font-size:12px;color:rgba(255,255,255,0.4);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">✅ RISULTATI</div><div class="tv-matches">`;
      for (const p of giocate) {
        const w1=p.gol_home>p.gol_away, w2=p.gol_away>p.gol_home;
        html+=`<div class="tv-match">
          <div class="tv-team ${w1?'tv-win':''}">${logoHTML(p.home,'sm')} <span style="font-size:19px">${p.home?.nome||'?'}</span></div>
          <div class="tv-score">${p.gol_home} — ${p.gol_away}</div>
          <div class="tv-team right ${w2?'tv-win':''}"><span style="font-size:19px">${p.away?.nome||'?'}</span> ${logoHTML(p.away,'sm')}</div>
        </div>`;
      }
      html += `</div>`;
    }
    if (daFare.length) {
      html += `<div style="font-size:12px;color:rgba(255,255,255,0.4);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:12px 0 8px;">🕐 PROGRAMMA</div><div class="tv-matches">`;
      for (const p of daFare) {
        html+=`<div class="tv-match tv-pending">
          <div class="tv-team">${logoHTML(p.home,'sm')} <span style="font-size:19px">${p.home?.nome||'?'}</span></div>
          <div class="tv-score tv-vs">${p.orario||'vs'}</div>
          <div class="tv-team right"><span style="font-size:19px">${p.away?.nome||'?'}</span> ${logoHTML(p.away,'sm')}</div>
        </div>`;
      }
      html += `</div>`;
    }
    if (!giocate.length && !daFare.length) html += '<div class="tv-empty">⏳ Nessuna partita</div>';
  }

  el.innerHTML = html;
  setTimeout(() => { el.style.transition='opacity 0.5s ease'; el.style.opacity='1'; }, 30);
}

  if(!TV_MODE) return;
  const cat=STATE.categorie[TV_CI];
  if(!cat) return;
  if(!TV_GIRONI.length) TV_GIRONI=await getGironiWithData(cat.id);

  const body=document.getElementById('tvo-body');
  const label=document.getElementById('tvo-label');
  if(!body) return;

  // Prende 4 gironi dalla posizione corrente
  const slice=TV_GIRONI.slice(TV_GI, TV_GI+TV_PER_PAG);
  const totPag=Math.ceil(TV_GIRONI.length/TV_PER_PAG);
  const pagCorrente=Math.floor(TV_GI/TV_PER_PAG)+1;
  const sez=TV_SI===0?'📊 Classifica':'⚽ Risultati';
  if(label) label.textContent=`${sez} — ${cat.nome} — Pag ${pagCorrente}/${totPag}`;

  body.style.opacity='0';
  let html='';

  if(TV_SI===0){
    // CLASSIFICA: griglia 2x2 con 4 gironi
    html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%;">';
    for(const g of slice){
      const giocate=g.partite.filter(p=>p.giocata).length;
      const sqMap={};
      g.partite.forEach(p=>{
        if(p.home?.id&&!_tvIsPlaceholder(p.home.nome)) sqMap[p.home.id]=p.home;
        if(p.away?.id&&!_tvIsPlaceholder(p.away.nome)) sqMap[p.away.id]=p.away;
      });
      const sq=Object.values(sqMap);
      html+=`<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px;overflow:hidden;">`;
      html+=`<div style="font-size:14px;font-weight:900;color:#F5A800;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:8px;">${g.nome}<span style="font-size:11px;background:rgba(245,168,0,0.12);padding:2px 8px;border-radius:20px;">${giocate}/${g.partite.length}</span></div>`;
      if(sq.length<2||giocate===0){
        html+=`<div style="color:rgba(255,255,255,0.2);font-size:14px;padding:10px 0;">⏳ Nessun risultato</div>`;
      } else {
        const cl=calcGironeClassifica({squadre:sq,partite:g.partite});
        html+=`<table style="width:100%;border-collapse:collapse;font-size:15px;">
          <thead><tr>
            <th style="color:rgba(255,255,255,.3);font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">#</th>
            <th style="color:rgba(255,255,255,.3);font-size:10px;padding:3px 4px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);">SQUADRA</th>
            <th style="color:rgba(255,255,255,.3);font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">G</th>
            <th style="color:rgba(255,255,255,.3);font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">V</th>
            <th style="color:rgba(255,255,255,.3);font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">P</th>
            <th style="color:rgba(255,255,255,.3);font-size:10px;padding:3px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06);">S</th>

          </tr></thead><tbody>`;
        cl.forEach((row,i)=>{
          const q=i<(cat.qualificate||1);
          const d=row.gf-row.gs;
          html+=`<tr style="background:${q?'rgba(212,43,43,0.08)':'transparent'}">

            <td style="padding:6px 4px;text-align:left;">
              <div style="display:flex;align-items:center;gap:6px;">
                ${logoHTML(row.sq,'sm')}
                <span style="font-size:15px;font-weight:${q?700:400};color:${q?'white':'rgba(255,255,255,0.75)'};">${row.sq.nome}</span>
              </div>
            </td>
            <td style="padding:6px 4px;text-align:center;color:rgba(255,255,255,0.7);">${row.g}</td>

            <td style="padding:6px 4px;text-align:center;color:rgba(255,255,255,0.7);">${row.p}</td>
            <td style="padding:6px 4px;text-align:center;color:${row.s>0?'#f87171':'rgba(255,255,255,0.5)'};">${row.s}</td>

            <td style="padding:6px 4px;text-align:center;color:#f87171;font-weight:600;">${row.gs}</td>
            <td style="padding:6px 4px;text-align:center;color:${d>0?'#4ade80':d<0?'#f87171':'#888'};font-weight:600;">${d>0?'+':''}${d}</td>
            <td style="padding:6px 4px;text-align:center;font-size:20px;font-weight:900;color:#F5A800;">${row.pts}</td>
          </tr>`;
        });
        html+=`</tbody></table>`;
      }
      html+=`</div>`;
    }
    html+='</div>';

  } else {
    // RISULTATI: 4 gironi in griglia 2x2
    html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%;">';
    for(const g of slice){
      html+=`<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:12px;overflow:hidden;">`;

          </div>`;
        });
      }
      if(!giocate.length&&!daFare.length) html+=`<div style="color:rgba(255,255,255,0.2);font-size:13px;padding:10px 0;">⏳ Nessuna partita</div>`;
      html+=`</div>`;
    }
    html+='</div>';
  }

  body.innerHTML=html;
  setTimeout(()=>{ body.style.transition='opacity 0.4s'; body.style.opacity='1'; },30);
}
