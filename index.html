<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Lion Trophy 2026</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#c41e3a; color:white; font-family:'Segoe UI',sans-serif; 
         display:flex; flex-direction:column; align-items:center; justify-content:center; 
         min-height:100vh; text-align:center; padding:20px; }
  img { width:120px; border-radius:50%; margin-bottom:24px; }
  h1 { font-size:2rem; font-weight:900; letter-spacing:2px; margin-bottom:8px; }
  h2 { font-size:1rem; font-weight:400; opacity:.8; margin-bottom:32px; }
  .box { background:rgba(255,255,255,.15); border-radius:16px; padding:28px 36px; max-width:400px; }
  .box p { font-size:1.1rem; line-height:1.6; }
  .loader { width:40px; height:40px; border:4px solid rgba(255,255,255,.3); 
            border-top-color:white; border-radius:50%; animation:spin 1s linear infinite; 
            margin:24px auto 0; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <img src="logo.png" alt="MC Lion Trophy">
  <h1>MC LION TROPHY</h1>
  <h2>II° TROFEO · VALLE D'AOSTA 2026</h2>
  <div class="box">
    <p>⚽ Il sito è temporaneamente in aggiornamento.<br><br>
    Torna tra qualche minuto per vedere classifiche e risultati in tempo reale!</p>
    <div class="loader"></div>
  </div>
</body>
</html>
